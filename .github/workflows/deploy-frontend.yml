name: Deploy Frontend

# Same staging -> gate -> production principle as deploy-backend.yml (ADR-0014), applied to
# the static frontend. Today there is no gate at all (direct push to the production S3
# bucket/CloudFront distribution on every push to master) - this rewrite adds a staging
# deploy step and puts production behind the GitHub Environment "production" manual approval,
# which is already a real improvement over the current state.
#
# Staging target (ADR-0011 amendment, 2026-08-10): dedicated S3 bucket + CloudFront
# distribution provisioned in terraform/site (s3.frontend-staging.tf,
# cloudfront.frontend-staging.tf), serving app-staging.ecommerce-devopsproject.com. This is
# distinct from staging.ecommerce-devopsproject.com, which remains the internal backend/API
# (ADR-0014) - do not point this workflow at that domain/bucket.
on:
  push:
    branches: [develop, 'feature/**']
    paths:
      - 'src/frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build
        working-directory: src/frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: src/frontend/dist/
          retention-days: 7

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist

      - name: Configure AWS credentials (staging role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # PENDING secret (repo config, not Terraform) - value is the
          # frontend_staging_role_arn output from terraform/site
          # (devopsproject-github-frontend-staging-role, ADR-0011 amendment 2026-08-10),
          # scoped to only the frontend-staging S3 bucket + CloudFront distribution.
          role-to-assume: ${{ secrets.FRONTEND_STAGING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3 (staging)
        run: |
          aws s3 sync dist/ s3://app-staging.ecommerce-devopsproject.com \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://app-staging.ecommerce-devopsproject.com/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      # ADR-0023 — o distribution ID e' resolvido em runtime pelo alias, em vez de
      # vir de um secret preenchido a mao. Motivo: o ID so' existe depois do apply da
      # stack `site` (Estagio 5), o que obrigava a voltar na configuracao do repositorio
      # no fim do processo; e ele muda a cada teardown+rebuild, entao o secret ficava
      # silenciosamente desatualizado (invalidacao apontando para uma distribuicao que
      # nao existe mais). Requer cloudfront:ListDistributions na role — concedida em
      # terraform/site/iam.github-frontend-staging-role.tf.
      - name: Resolve CloudFront distribution ID (staging)
        id: cloudfront
        run: |
          set -euo pipefail
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, 'app-staging.ecommerce-devopsproject.com')].Id | [0]" \
            --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "::error::Nenhuma distribuicao CloudFront com o alias app-staging.ecommerce-devopsproject.com. A stack `site` foi aplicada (Estagio 5)?"
            exit 1
          fi
          echo "distribution-id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "Distribuicao resolvida: $DIST_ID"

      - name: Invalidate CloudFront (staging)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cloudfront.outputs.distribution-id }} \
            --paths "/*"

  # GitHub Environment "production" pauses this job for manual approval (required reviewers)
  # before anything below runs - the same gate mechanism as deploy-backend.yml's
  # promote-production job (ADR-0014, Decisao 1).
  deploy-production:
    needs: deploy-staging
    # ADR-0021: mesma guarda do job promote-production em deploy-backend.yml - so
    # promove a partir de um commit ja mergeado na develop.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist

      - name: Configure AWS credentials (production role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # NEW/PENDING secret - replaces the current, ungated devopsproject-github-frontend-role
          # (ADR-0005) with an environment-scoped role, trust sub=repo:...:environment:production,
          # following the same convergence plan documented in ADR-0014.
          role-to-assume: ${{ secrets.FRONTEND_PROD_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3 (production)
        run: |
          aws s3 sync dist/ s3://ecommerce-devopsproject.com \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://ecommerce-devopsproject.com/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      # ADR-0023 — o distribution ID e' resolvido em runtime pelo alias, em vez de
      # vir de um secret preenchido a mao. Motivo: o ID so' existe depois do apply da
      # stack `site` (Estagio 5), o que obrigava a voltar na configuracao do repositorio
      # no fim do processo; e ele muda a cada teardown+rebuild, entao o secret ficava
      # silenciosamente desatualizado (invalidacao apontando para uma distribuicao que
      # nao existe mais). Requer cloudfront:ListDistributions na role — concedida em
      # terraform/site/iam.github-frontend-role.tf.
      - name: Resolve CloudFront distribution ID (producao)
        id: cloudfront
        run: |
          set -euo pipefail
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, 'ecommerce-devopsproject.com')].Id | [0]" \
            --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "::error::Nenhuma distribuicao CloudFront com o alias ecommerce-devopsproject.com. A stack `site` foi aplicada (Estagio 5)?"
            exit 1
          fi
          echo "distribution-id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "Distribuicao resolvida: $DIST_ID"

      - name: Invalidate CloudFront (production)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cloudfront.outputs.distribution-id }} \
            --paths "/*"
