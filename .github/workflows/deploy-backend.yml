name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'src/services/**'
      - 'src/workers/**'
      - 'src/domains/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_BASE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/devopsproject/prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: main
            dockerfile: src/services/DevOpsProjectEcommerce.Main/Dockerfile
          - name: order
            dockerfile: src/services/DevOpsProjectEcommerce.Order/Dockerfile
          - name: identity-server
            dockerfile: src/services/DevOpsProjectEcommerce.IdentityServer/Dockerfile
          - name: health-checker
            dockerfile: src/services/DevOpsProjectEcommerce.HealthChecker/Dockerfile
          - name: notificator
            dockerfile: src/workers/DevOpsProjectEcommerce.Notificator/Dockerfile
          - name: invoice-generator
            dockerfile: src/workers/DevOpsProjectEcommerce.InvoiceGenerator/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BACKEND_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service.name }}
        id: build
        run: |
          IMAGE="${{ env.ECR_BASE }}/${{ matrix.service.name }}:${{ github.sha }}"
          LATEST="${{ env.ECR_BASE }}/${{ matrix.service.name }}:latest"
          docker build -f ${{ matrix.service.dockerfile }} -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Scan ${{ matrix.service.name }} with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_BASE }}/${{ matrix.service.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign ${{ matrix.service.name }} image
        run: cosign sign --yes "${{ steps.build.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Generate SBOM for ${{ matrix.service.name }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_BASE }}/${{ matrix.service.name }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service.name }}.spdx.json
          upload-artifact: true
          artifact-name: sbom-${{ matrix.service.name }}-${{ github.sha }}
