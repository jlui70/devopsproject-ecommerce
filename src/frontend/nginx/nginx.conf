server {
    listen *:3000;

    location /main/ {
        resolver 127.0.0.11;
        set $upstream dpe.main.internal;
        proxy_pass https://$upstream;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /order/ {
        resolver 127.0.0.11;
        set $upstream dpe.order.internal;
        proxy_pass https://$upstream;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /identity/ {
        resolver 127.0.0.11;
        set $upstream dpe.identity.internal;
        proxy_pass https://$upstream;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthchecks/ {
        resolver 127.0.0.11;
        set $upstream dpe.health-checker.internal;
        proxy_pass https://$upstream;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /invoice/ {
        resolver 127.0.0.11;
        set $upstream dpe.invoice.internal;
        proxy_pass https://$upstream;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /notificator/ {
        resolver 127.0.0.11;
        set $upstream dpe.notificator.internal;
        proxy_pass https://$upstream;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
